spring:
  application:
    name: todo-app

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/todo_db
    driver-class-name: org.postgresql.Driver
    username: todo_user
    password: todo_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true